[metadata]
name = "simple"
version = "1.0"
description = "Simple training"
type = "TRAINING"

[execution]
pipeline_script = "pipeline.py"
requirements_file = "pyproject.toml"
parameters_class = "utils/parameters.py:TrainingHyperParameters"

[docker]
image_name = "picsellia/simple-template"
image_tag = "latest"

[model_version]
origin_name = "simple-template"
name = "latest"
framework = "ONNX"
inference_type = "OBJECT_DETECTION"
